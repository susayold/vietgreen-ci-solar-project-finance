name: v4-phase2-validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v4_phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V4 Phase 2 engine on the remote runner
        run: python -m analytics.v4_phase2_engine
      - name: Check Phase 2 aggregate evidence
        run: |
          test -f outputs/fx_break_even_v4.csv
          test -f outputs/fx_funding_comparison_v4.csv
          test -f outputs/portfolio_exposure_v4.csv
          test -f outputs/pooling_comparison_v4.csv
          test -f outputs/scenario_summary_v4_phase2.csv
          test -f validation/FX_QA.csv
          test -f validation/V4_PHASE2_DOD.csv
          test -f validation/V4_PHASE2_RED_TEAM_REPORT.md
          test -f validation/V4_READINESS_STATE.csv
      - name: Commit V4 Phase 2 aggregate evidence
        run: |
          git config user.name "vietgreen-actions"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/fx_break_even_v4.csv outputs/fx_funding_comparison_v4.csv outputs/portfolio_exposure_v4.csv outputs/pooling_comparison_v4.csv outputs/scenario_summary_v4_phase2.csv validation/FX_QA.csv validation/V4_PHASE2_DOD.csv validation/V4_PHASE2_RED_TEAM_REPORT.md validation/V4_READINESS_STATE.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: run V4 phase 2 debt FX portfolio evidence [skip ci]"
          git push origin HEAD:main
      - name: Upload Phase 2 aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: vietgreen-v4-phase2-evidence
          path: |
            outputs/fx_break_even_v4.csv
            outputs/fx_funding_comparison_v4.csv
            outputs/portfolio_exposure_v4.csv
            outputs/pooling_comparison_v4.csv
            outputs/scenario_summary_v4_phase2.csv
            validation/FX_QA.csv
            validation/V4_PHASE2_DOD.csv
            validation/V4_PHASE2_RED_TEAM_REPORT.md
            validation/V4_READINESS_STATE.csv
