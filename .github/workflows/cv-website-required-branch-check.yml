name: cv-website-required-branch-check

on:
  pull_request:
    branches: [v5.1.3-cv-website-from-scratch]

permissions:
  contents: read

jobs:
  validate-cv-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation runtimes
        run: python -m pip install --upgrade pip && python -m pip install pytest openpyxl pandas
      - name: Rebuild and validate frozen model
        env:
          MODEL_SOURCE_SHA: ff69e15d211ff1abc88200574242ed2f1db49074
        run: |
          export GITHUB_SHA="$MODEL_SOURCE_SHA"
          python -m analytics.build_v5_1_3_release
          python -m analytics.validate_v5_1_3_release
      - name: Validate exact website payload
        env:
          WEBSITE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          WEBSITE_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/build_cv_website_data_v2.py
          python scripts/validate_cv_website_data_v2.py
          python scripts/validate_claims.py
