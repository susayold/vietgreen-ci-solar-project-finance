name: Excel static workbook validation

on:
  push:
    branches: [feature/excel-model-static-workbook]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize Excel viewer URL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/excel-model/page.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "const WORKBOOK_BLOB = `${REPO}/blob/main/model/vietgreen_core_model.xlsx`;\nconst WORKBOOK_FILENAME = 'vietgreen_core_model.xlsx';",
                  "const WORKBOOK_BLOB = `${REPO}/blob/main/model/vietgreen_core_model.xlsx`;\nconst WORKBOOK_URL = 'https://susayold.github.io/vietgreen-ci-solar-project-finance/downloads/vietgreen_core_model.xlsx';\nconst OFFICE_VIEWER = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(WORKBOOK_URL)}`;",
              ),
              (
                  "  const [loading, setLoading] = useState(true);\n  const [workbookUrl, setWorkbookUrl] = useState(WORKBOOK_BLOB);\n  const [officeViewerUrl, setOfficeViewerUrl] = useState('');",
                  "  const [loading, setLoading] = useState(true);",
              ),
              (
                  "    const queryId = new URLSearchParams(window.location.search).get('project');\n    const basePath = window.location.pathname.startsWith('/vietgreen-ci-solar-project-finance/showcase')\n      ? '/vietgreen-ci-solar-project-finance/showcase'\n      : window.location.pathname.startsWith('/vietgreen-ci-solar-project-finance')\n        ? '/vietgreen-ci-solar-project-finance'\n        : '';\n    const hostedWorkbookUrl = `${window.location.origin}${basePath}/downloads/${WORKBOOK_FILENAME}`;\n    setWorkbookUrl(hostedWorkbookUrl);\n    setOfficeViewerUrl(`https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(hostedWorkbookUrl)}`);",
                  "    const queryId = new URLSearchParams(window.location.search).get('project');",
              ),
              ("href={workbookUrl}", "href={WORKBOOK_URL}"),
              ("src={officeViewerUrl || undefined}", "src={OFFICE_VIEWER}"),
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  changed = True
          if changed:
              path.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet -- app/excel-model/page.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/excel-model/page.tsx
            git commit -m "Use stable hosted Excel workbook URL"
            git push
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild and validate native Excel workbook
        run: |
          python -m analytics.build_native_workbook
          python -m analytics.validate_workbook
          python - <<'PY'
          import zipfile
          from xml.etree import ElementTree as ET
          from pathlib import Path
          path = Path('model/vietgreen_core_model.xlsx')
          with zipfile.ZipFile(path) as zf:
              bad = []
              for name in zf.namelist():
                  if name.endswith(('.xml', '.rels')):
                      try:
                          ET.fromstring(zf.read(name))
                      except ET.ParseError as exc:
                          bad.append((name, str(exc)))
              if bad:
                  raise SystemExit(f'Malformed OOXML: {bad}')
          print('OOXML parse: PASS')
          PY
          if ! git diff --quiet -- model/vietgreen_core_model.xlsx validation/WORKBOOK_VALIDATION_RESULTS.csv validation/WORKBOOK_VALIDATION_REPORT.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add model/vietgreen_core_model.xlsx validation/WORKBOOK_VALIDATION_RESULTS.csv validation/WORKBOOK_VALIDATION_REPORT.md
            git commit -m "Rebuild valid native Excel workbook"
            git push
          fi

      - name: Recalculate frozen recruiter data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33629919973 --repo susayold/vietgreen-ci-solar-project-finance --name vietgreen-v5-1-3-full-data-model-release --dir /tmp/vietgreen-frozen
          python scripts/build_corrected_model.py /tmp/vietgreen-frozen

      - name: Validate data and claims
        run: |
          npm run test:data
          npm run test:claims

      - name: Lint
        run: npm run lint

      - name: Build static recruiter site
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Verify workbook published into static build
        run: |
          test -s dist/client/downloads/vietgreen_core_model.xlsx
          test "$(stat -c%s dist/client/downloads/vietgreen_core_model.xlsx)" -gt 100000
          python - <<'PY'
          import zipfile
          from xml.etree import ElementTree as ET
          path = 'dist/client/downloads/vietgreen_core_model.xlsx'
          with zipfile.ZipFile(path) as zf:
              for name in zf.namelist():
                  if name.endswith(('.xml', '.rels')):
                      ET.fromstring(zf.read(name))
          print('Published workbook OOXML: PASS')
          PY

      - name: Browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line
