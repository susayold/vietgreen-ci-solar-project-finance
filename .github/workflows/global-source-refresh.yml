name: Global Public Source Metadata Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official source availability without storing raw content
        run: python research/refresh_global_sources.py
      - name: Upload metadata-only refresh log
        uses: actions/upload-artifact@v4
        with:
          name: global-source-metadata-refresh
          path: artifacts/GLOBAL_SOURCE_REFRESH.csv
          if-no-files-found: error
