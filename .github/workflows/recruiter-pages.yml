name: recruiter-pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/build_website_data.py"
      - "scripts/validate_website_data.py"
      - "scripts/check_stale_v3_claims.py"
      - "outputs/**"
      - "release/MODEL_RELEASE_MANIFEST.json"
      - "validation/**"
      - ".github/workflows/recruiter-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build website data contract
        run: python scripts/build_website_data.py

      - name: Validate website data contract
        run: python scripts/validate_website_data.py

      - name: Block stale V3 claims
        run: python scripts/check_stale_v3_claims.py

      - name: Verify aggregate-only website boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f website/index.html
          if rg -n -i 'private_validation|hidden_truth|password|secret|token|localhost|[A-Z]:\\\\|/Users/' website; then
            echo "Website boundary check failed"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R website/. _site/
          touch _site/.nojekyll

      - name: HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory website >/tmp/vietgreen-site-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8765/data/shared-summary.json >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/model_preview/index.html >/dev/null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
