name: recruiter-pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/recruiter-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify aggregate-only website boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f website/index.html
          if rg -n -i 'private_validation|hidden_truth|password|secret|token|localhost|[A-Z]:\\\\|/Users/' website; then
            echo "Website boundary check failed"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R website/. _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
