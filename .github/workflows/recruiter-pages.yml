name: recruiter-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: recruiter-pages-compat
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    # Compatibility required check for main branch protection.
    # The actual GitHub Pages deployment remains owned by codex-github-pages.yml.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate SHA
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Recalculate current website data from verified baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33629919973 --repo susayold/vietgreen-ci-solar-project-finance --name vietgreen-v5-1-3-full-data-model-release --dir /tmp/vietgreen-frozen
          python scripts/build_corrected_model.py /tmp/vietgreen-frozen

      - name: Validate website data contract
        run: npm run test:data

      - name: Validate website claims
        run: npm run test:claims

      - name: Lint current website source
        run: npm run lint

      - name: Build current eight-page website
        env:
          GITHUB_PAGES: "true"
        run: npm run build
