name: core-validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run data quality
        run: python -m analytics.data_quality
      - name: Run remote core model
        run: python -m analytics.run_core_model
      - name: Run hidden-truth firewall
        run: python -m analytics.hidden_truth_validation
      - name: Build native workbook
        run: python -m analytics.build_native_workbook
      - name: Validate native workbook structure
        run: python -m analytics.validate_workbook
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit refreshed native workbook to GitHub
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          git config user.name "vietgreen-actions"
          git config user.email "actions@users.noreply.github.com"
          git add model/vietgreen_core_model.xlsx outputs/ validation/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh native workbook [skip ci]"
          git push origin HEAD:main
      - name: Upload remote outputs
        uses: actions/upload-artifact@v4
        with:
          name: vietgreen-core-outputs
          path: |
            model/vietgreen_core_model.xlsx
            outputs/
            validation/
            release/
