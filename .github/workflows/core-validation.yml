name: core-validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run data quality
        run: python -m analytics.data_quality
      - name: Run remote model
        run: python -m analytics.run_core_model
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Upload remote outputs
        uses: actions/upload-artifact@v4
        with:
          name: vietgreen-core-outputs
          path: |
            outputs/
            validation/
            release/
