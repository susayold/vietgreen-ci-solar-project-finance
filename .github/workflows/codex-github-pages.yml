name: VietGreen current web · GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vietgreen-current-web-pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current web source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install recruiter workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Import hash-verified frozen release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33629919973 --repo susayold/vietgreen-ci-solar-project-finance --name vietgreen-v5-1-3-full-data-model-release --dir /tmp/vietgreen-frozen
          python scripts/build_corrected_model.py /tmp/vietgreen-frozen

      - name: Preserve corrected model results and verification
        uses: actions/upload-artifact@v4
        with:
          name: vietgreen-corrected-model
          path: |
            artifacts/recruiter_revision/outputs
            artifacts/recruiter_revision/release

      - name: Seal website release identity
        env:
          WEBSITE_SOURCE_SHA: ${{ github.sha }}
          WEBSITE_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          export WEBSITE_BUILD_TIME_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/normalize_v5_1_3_snapshot.py

      - name: Validate website data contract
        run: npm run test:data

      - name: Validate website claims
        run: npm run test:claims

      - name: Lint website source
        run: npm run lint

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Verify company-style recruiter workbook
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          path = 'dist/client/downloads/vietgreen_core_model.xlsx'
          wb = load_workbook(path, read_only=False, data_only=False)
          assert wb.sheetnames[0] == '00_Control'
          assert wb['00_Control']['A1'].value == 'VIETGREEN C&I SOLAR | PROJECT FINANCE INVESTMENT SUMMARY'
          assert wb['12_Debt_Sculpting']['A19'].value == 'DEBT SCULPTING CONTROL CHECKS'
          assert 'EXCEL SKILLS DEMONSTRATED' not in str(wb['00_Control']['A15'].value or '')
          print('Recruiter workbook presentation: PASS')
          PY

      - name: Browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line

      - name: Prepare project-site routes
        run: |
          set -euo pipefail
          rm -rf _site
          cp -R dist/client _site
          for route in projects energy economics debt risk diligence excel-model model-evidence; do
            mkdir -p "_site/$route"
            cp "_site/$route.html" "_site/$route/index.html"
          done
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

          # Paths are emitted by the framework basePath; never rewrite JS runtime strings.

      - name: Configure Pages
        # Publish a separate, complete recruiter presentation at /showcase/.
        run: echo "Preparing recruiter presentation"

      - name: Build recruiter presentation
        env:
          GITHUB_PAGES: "true"
          SITE_BASE_PATH: /vietgreen-ci-solar-project-finance/showcase
        run: |
          npm run build
          mkdir -p _site/showcase
          cp -R dist/client/. _site/showcase/
          for route in projects energy economics debt risk diligence excel-model model-evidence; do
            mkdir -p "_site/showcase/$route"
            cp "_site/showcase/$route.html" "_site/showcase/$route/index.html"
          done

      - name: Configure Pages hosting
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public routes and Excel workbook
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/"
          for route in "" projects/ energy/ economics/ debt/ risk/ diligence/ excel-model/ model-evidence/; do
            curl --fail --silent --show-error "${base}${route}" >/dev/null
          done
          curl --fail --silent --show-error "${base}downloads/vietgreen_core_model.xlsx" -o /tmp/vietgreen_core_model.xlsx
          test "$(stat -c%s /tmp/vietgreen_core_model.xlsx)" -gt 100000
          python - <<'PY'
          import zipfile
          from xml.etree import ElementTree as ET
          path = '/tmp/vietgreen_core_model.xlsx'
          with zipfile.ZipFile(path) as zf:
              for name in zf.namelist():
                  if name.endswith(('.xml', '.rels')):
                      ET.fromstring(zf.read(name))
          print('Live workbook OOXML: PASS')
          PY
          echo "GitHub Pages live: ${base}"
