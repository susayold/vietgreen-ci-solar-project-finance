name: VietGreen current web · GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vietgreen-current-web-pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current web source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install recruiter workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Import hash-verified frozen release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33629919973 --repo susayold/vietgreen-ci-solar-project-finance --name vietgreen-v5-1-3-full-data-model-release --dir /tmp/vietgreen-frozen
          python scripts/build_corrected_model.py /tmp/vietgreen-frozen

      - name: Preserve corrected model results and verification
        uses: actions/upload-artifact@v4
        with:
          name: vietgreen-corrected-model
          path: |
            artifacts/recruiter_revision/outputs
            artifacts/recruiter_revision/release

      - name: Seal website release identity
        env:
          WEBSITE_SOURCE_SHA: ${{ github.sha }}
          WEBSITE_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          export WEBSITE_BUILD_TIME_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/normalize_v5_1_3_snapshot.py

      - name: Validate website data contract
        run: npm run test:data

      - name: Validate website claims
        run: npm run test:claims

      - name: Lint website source
        run: npm run lint

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Inject cached recruiter workbook values
        run: |
          python scripts/inject_recruiter_workbook_cache.py \
            dist/client/downloads/vietgreen_core_model.xlsx \
            scripts/recruiter_workbook_cache_part1.json \
            scripts/recruiter_workbook_cache_part2.json \
            scripts/recruiter_workbook_cache_overrides.json

      - name: Verify classic project-finance recruiter workbook
        run: |
          python - <<'PY'
          from math import isclose
          from openpyxl import load_workbook

          path = 'dist/client/downloads/vietgreen_core_model.xlsx'
          wb = load_workbook(path, read_only=False, data_only=False)
          expected = [
              '00_Title_Page', '01_Dashboard', '02_Model_Log', '03_Input_Scenarios',
              '04_Construction_Workings', '05_Project_Workings', '06_Financing_Workings',
              '07_Cashflow_Waterfall', '08_Coverage_Returns', '09_Sensitivity',
              '10_IC_Decision', '11_Model_Checks',
          ]
          assert wb.sheetnames[:len(expected)] == expected
          assert wb['00_Title_Page']['B3'].value == 'VIETGREEN C&I SOLAR — PROJECT FINANCE MODEL'
          assert wb['01_Dashboard']['A17'].value == 'DOWNSIDE REVIEW'
          assert wb['06_Financing_Workings']['A18'].value == 'SENIOR DEBT REPAYMENT SCHEDULE'
          assert wb['09_Sensitivity']['A18'].value == 'REGISTERED DOWNSIDE RESULTS'
          assert '00_Control' in wb.sheetnames
          assert wb['00_Control'].sheet_state == 'hidden'
          assert str(wb['01_Dashboard']['B6'].value).startswith('=')
          assert str(wb['06_Financing_Workings']['E8'].value).startswith('=')
          for ws in wb.worksheets:
              for row in ws.iter_rows():
                  for cell in row:
                      assert 'SKILLS DEMONSTRATED' not in str(cell.value or '').upper()

          values = load_workbook(path, read_only=True, data_only=True)
          assert isclose(values['01_Dashboard']['B6'].value, 1.4, rel_tol=0, abs_tol=1e-9)
          assert isclose(values['01_Dashboard']['E6'].value, 31.056520833333327, rel_tol=0, abs_tol=1e-9)
          assert isclose(values['03_Input_Scenarios']['B22'].value, 0.05, rel_tol=0, abs_tol=1e-12)
          assert values['03_Input_Scenarios']['B23'].value == 350
          assert isclose(values['04_Construction_Workings']['E19'].value, 29.75, rel_tol=0, abs_tol=1e-9)
          assert isclose(values['04_Construction_Workings']['E23'].value, 31.056520833333327, rel_tol=0, abs_tol=1e-9)
          assert isclose(values['06_Financing_Workings']['E8'].value, 0.05, rel_tol=0, abs_tol=1e-12)
          assert isclose(values['06_Financing_Workings']['E10'].value, 0.085, rel_tol=0, abs_tol=1e-12)
          assert isclose(values['06_Financing_Workings']['H27'].value, 1.3, rel_tol=0, abs_tol=1e-12)
          assert isclose(values['08_Coverage_Returns']['O25'].value, 0.7103846152506619, rel_tol=0, abs_tol=1e-12)
          assert values['09_Sensitivity']['B20'].value == 1
          assert values['09_Sensitivity']['F20'].value == 'PASS'
          assert values['11_Model_Checks']['B7'].value == 'PASS'
          print('Classic project-finance recruiter workbook formulas + cached presentation values: PASS')
          PY

      - name: Browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line

      - name: Prepare project-site routes
        run: |
          set -euo pipefail
          rm -rf _site
          cp -R dist/client _site
          for route in projects energy economics debt risk diligence excel-model model-evidence; do
            mkdir -p "_site/$route"
            cp "_site/$route.html" "_site/$route/index.html"
          done
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Configure Pages
        run: echo "Preparing recruiter presentation"

      - name: Build recruiter presentation
        env:
          GITHUB_PAGES: "true"
          SITE_BASE_PATH: /vietgreen-ci-solar-project-finance/showcase
        run: |
          npm run build
          python scripts/inject_recruiter_workbook_cache.py \
            dist/client/downloads/vietgreen_core_model.xlsx \
            scripts/recruiter_workbook_cache_part1.json \
            scripts/recruiter_workbook_cache_part2.json \
            scripts/recruiter_workbook_cache_overrides.json
          mkdir -p _site/showcase
          cp -R dist/client/. _site/showcase/
          for route in projects energy economics debt risk diligence excel-model model-evidence; do
            mkdir -p "_site/showcase/$route"
            cp "_site/showcase/$route.html" "_site/showcase/$route/index.html"
          done

      - name: Configure Pages hosting
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Setup Python for live workbook verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install live workbook verification dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Verify public routes and Excel workbook
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/"
          for route in "" projects/ energy/ economics/ debt/ risk/ diligence/ excel-model/ model-evidence/; do
            curl --fail --silent --show-error "${base}${route}" >/dev/null
          done
          curl --fail --silent --show-error "${base}downloads/vietgreen_core_model.xlsx?v=${GITHUB_SHA}" -o /tmp/vietgreen_core_model.xlsx
          test "$(stat -c%s /tmp/vietgreen_core_model.xlsx)" -gt 100000
          python - <<'PY'
          import zipfile
          from math import isclose
          from xml.etree import ElementTree as ET
          from openpyxl import load_workbook

          path = '/tmp/vietgreen_core_model.xlsx'
          with zipfile.ZipFile(path) as zf:
              for name in zf.namelist():
                  if name.endswith(('.xml', '.rels')):
                      ET.fromstring(zf.read(name))
          values = load_workbook(path, read_only=True, data_only=True)
          assert isclose(values['01_Dashboard']['B6'].value, 1.4, rel_tol=0, abs_tol=1e-9)
          assert isclose(values['03_Input_Scenarios']['B22'].value, 0.05, rel_tol=0, abs_tol=1e-12)
          assert values['03_Input_Scenarios']['B23'].value == 350
          assert isclose(values['04_Construction_Workings']['E19'].value, 29.75, rel_tol=0, abs_tol=1e-9)
          assert isclose(values['04_Construction_Workings']['E23'].value, 31.056520833333327, rel_tol=0, abs_tol=1e-9)
          assert isclose(values['06_Financing_Workings']['E8'].value, 0.05, rel_tol=0, abs_tol=1e-12)
          assert isclose(values['08_Coverage_Returns']['O25'].value, 0.7103846152506619, rel_tol=0, abs_tol=1e-12)
          assert values['09_Sensitivity']['B20'].value == 1
          assert values['09_Sensitivity']['F20'].value == 'PASS'
          assert values['11_Model_Checks']['B7'].value == 'PASS'
          print('Live workbook OOXML + cached presentation values: PASS')
          PY
          echo "GitHub Pages live: ${base}"
