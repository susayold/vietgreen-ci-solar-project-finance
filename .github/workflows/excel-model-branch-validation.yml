name: Excel model branch validation

on:
  push:
    branches: [feature/excel-model-showcase]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Recalculate frozen recruiter data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33629919973 --repo susayold/vietgreen-ci-solar-project-finance --name vietgreen-v5-1-3-full-data-model-release --dir /tmp/vietgreen-frozen
          python scripts/build_corrected_model.py /tmp/vietgreen-frozen

      - name: Validate data and claims
        run: |
          npm run test:data
          npm run test:claims

      - name: Lint
        run: npm run lint

      - name: Build static recruiter site
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line
