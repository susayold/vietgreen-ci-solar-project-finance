name: cv-website-from-scratch

on:
  push:
    branches: [v5.1.3-cv-website-from-scratch]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cv-website-pages
  cancel-in-progress: true

jobs:
  validate-cv-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Install runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest openpyxl pandas
          npm install --prefix website --no-audit --no-fund
          npx --prefix website playwright install chromium
      - name: Rebuild frozen model and website data
        env:
          MODEL_SOURCE_SHA: ff69e15d211ff1abc88200574242ed2f1db49074
          WEBSITE_SOURCE_SHA: ${{ github.sha }}
          WEBSITE_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          export GITHUB_SHA="$MODEL_SOURCE_SHA"
          python -m analytics.build_v5_1_3_release
          python -m analytics.validate_v5_1_3_release
          export GITHUB_SHA="$WEBSITE_SOURCE_SHA"
          python scripts/build_cv_website_data.py
          python scripts/validate_cv_website_data.py
          python scripts/validate_claims.py
          python scripts/validate_release_identity.py
          python -m pytest -q tests/test_cv_website_data.py
      - name: Build website
        run: |
          npm run typecheck --prefix website
          npm run build --prefix website
      - name: Browser QA
        run: |
          nohup bash -c "cd website && npm run preview -- --host 127.0.0.1 --port 4173" > /tmp/vietgreen-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          npx --prefix website playwright test website/tests/v5_1_3_cv_website.spec.mjs --reporter=line
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-website-qa-${{ github.run_id }}
          path: |
            website/public/data
            website/test-results
            test-results
            /tmp/vietgreen-preview.log
          if-no-files-found: ignore
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: validate-cv-website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
