name: cv-website-with-old-website-archive

on:
  push:
    branches: [old-website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cv-website-pages
  cancel-in-progress: true

jobs:
  validate-cv-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Install runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest openpyxl pandas
          npm install --prefix website --no-audit --no-fund
          npx --prefix website playwright install chromium
      - name: Rebuild frozen model and website data
        env:
          MODEL_SOURCE_SHA: ff69e15d211ff1abc88200574242ed2f1db49074
          WEBSITE_SOURCE_SHA: ${{ github.sha }}
          WEBSITE_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          export GITHUB_SHA="$MODEL_SOURCE_SHA"
          python -m analytics.build_v5_1_3_release
          python -m analytics.validate_v5_1_3_release
          export GITHUB_SHA="$WEBSITE_SOURCE_SHA"
          python scripts/build_cv_website_data.py
          python scripts/validate_cv_website_data.py
          python scripts/validate_claims.py
          python scripts/validate_release_identity.py
          python -m pytest -q tests/test_cv_website_data.py
      - name: Build current website and attach legacy archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("website/public/data/release.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["websiteStatus"] = "DEPLOYED_EXACT_SHA"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          npm run typecheck --prefix website
          npm run build --prefix website
          test -f old-website/index.html
          test -f old-website/app.js
          test -f old-website/styles.css
          test -f old-website/data/overview.json
          rm -rf website/dist/old-website
          cp -R old-website website/dist/old-website
      - name: Browser QA
        run: |
          nohup bash -c "cd website && npm run preview -- --host 127.0.0.1 --port 4173" > /tmp/vietgreen-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:4173/old-website/ >/dev/null
          curl -fsS http://127.0.0.1:4173/old-website/app.js >/dev/null
          curl -fsS http://127.0.0.1:4173/old-website/styles.css >/dev/null
          curl -fsS http://127.0.0.1:4173/old-website/data/overview.json >/dev/null
          npx --prefix website playwright test website/tests/v5_1_3_cv_website.spec.mjs --reporter=line
      - name: Verify legacy archive identity
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "old-website/index.html": "e5a5c7323b57c425a0fcd6517f7f17bad9234cd4",
              "old-website/app.js": "e3b81a11d4b7a091f316a7ef261f951a7fe4649f",
              "old-website/styles.css": "056ddf3c28b3530acf5fbdf0babfa9bc9a09c53d",
          }
          # Git blob SHA = sha1("blob <size>\\0" + content)
          for name, want in expected.items():
              data = Path(name).read_bytes()
              got = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              assert got == want, (name, got, want)
          text = Path("old-website/data/overview.json").read_text(encoding="utf-8")
          assert "0 / 20 Current Terms rows have positive Equity NPV" in text
          print("OLD_WEBSITE_EXACT_SOURCE_PASS")
          PY
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-website-with-old-website-qa-${{ github.run_id }}
          path: |
            website/public/data
            website/test-results
            test-results
            old-website
            /tmp/vietgreen-preview.log
          if-no-files-found: ignore
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: validate-cv-website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live old-website route
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          curl -fsS "$base/old-website/" >/dev/null
          curl -fsS "$base/old-website/data/overview.json" | grep -F "0 / 20 Current Terms rows have positive Equity NPV" >/dev/null
          echo "OLD_WEBSITE_LIVE_PASS $base/old-website/"
