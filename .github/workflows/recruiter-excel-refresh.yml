name: Recruiter Excel refresh

on:
  push:
    branches: [update/recruiter-excel-model]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize generator syntax and XML metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('analytics/build_native_workbook.py')
          text = path.read_text(encoding='utf-8')
          fixes = [
              (
                  "f'<cellXfs count=\"{len(xfs)}'>{\"\".join(xfs)}</cellXfs>'",
                  "f'<cellXfs count=\"{len(xfs)}\">{\"\".join(xfs)}</cellXfs>'",
              ),
              (
                  'VietGreen C&I Solar Project Finance — Recruiter Model',
                  'VietGreen C&amp;I Solar Project Finance — Recruiter Model',
              ),
          ]
          for bad, good in fixes:
              text = text.replace(bad, good)
          path.write_text(text, encoding='utf-8')
          compile(text, str(path), 'exec')
          print('Generator syntax/XML metadata: PASS')
          PY

      - name: Build recruiter Excel model
        run: python -m analytics.build_native_workbook

      - name: Validate workbook structure
        run: |
          if ! python -m analytics.validate_workbook; then
            echo '--- WORKBOOK VALIDATION REPORT ---'
            cat validation/WORKBOOK_VALIDATION_REPORT.md || true
            echo '--- WORKBOOK VALIDATION RESULTS ---'
            cat validation/WORKBOOK_VALIDATION_RESULTS.csv || true
            exit 1
          fi
          python - <<'PY'
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          path = Path('model/vietgreen_core_model.xlsx')
          assert path.exists() and path.stat().st_size > 100000, path
          with zipfile.ZipFile(path) as zf:
              assert zf.testzip() is None
              for name in zf.namelist():
                  if name.endswith(('.xml', '.rels')):
                      ET.fromstring(zf.read(name))
              workbook = ET.fromstring(zf.read('xl/workbook.xml'))
              ns = {'m': 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
              names = [node.attrib['name'] for node in workbook.findall('m:sheets/m:sheet', ns)]
              assert len(names) == 22, names
              debt_xml = zf.read('xl/worksheets/sheet13.xml').decode('utf-8')
              for token in ('<f>C7*$B$4</f>', '<f>MIN(B7/E7,C7+D7)</f>', '<f>MAX(0,MIN(C7,F7-D7))</f>'):
                  assert token in debt_xml, token
              assert 'IF(F7=0' in debt_xml
              control_xml = zf.read('xl/worksheets/sheet1.xml').decode('utf-8')
              for token in ('EXCEL SKILLS DEMONSTRATED', 'INDEX + MATCH', 'SUMIFS'):
                  assert token in control_xml, token
          print('Recruiter workbook validation: PASS')
          PY

      - name: Commit modeling changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/build_native_workbook.py model/vietgreen_core_model.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "Refresh recruiter-facing Excel model"
            git push
          else
            echo "Modeling files already up to date"
          fi
