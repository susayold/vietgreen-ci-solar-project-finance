name: final-semantic-cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-semantic-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Patch remaining selected-project semantic labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p=Path(path); text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, got {count}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          # Page 3: LEVEL_3_ANNUAL_ONLY is an evidence level, not a QA pass/fail status.
          replace('app/energy/page.tsx', 'QA Status <b>{selectedEnergy?.loadEvidenceLevel', 'Load Evidence <b>{selectedEnergy?.loadEvidenceLevel')

          # Page 6: these KPIs follow the selected project and must not retain GO Mall wording.
          replace('app/risk/page.tsx', 'Worst GO Mall Min DSCR', 'Worst Selected-Project Min DSCR')
          replace('app/risk/page.tsx', 'GO Mall Zero-DSCR Scenarios', 'Selected-Project Zero-DSCR Scenarios')

          # Page 7: the table/filter intentionally uses the first action as the primary action; label it explicitly.
          p=Path('app/diligence/page.tsx'); text=p.read_text(encoding='utf-8')
          text=text.replace("const [action, setAction] = useState('All next actions');", "const [action, setAction] = useState('All primary actions');")
          text=text.replace("action === 'All next actions' || record.nextAction === action", "action === 'All primary actions' || record.nextAction === action")
          text=text.replace('<Target size={15} /> Next action', '<Target size={15} /> Primary next action')
          text=text.replace('<option>All next actions</option>', '<option>All primary actions</option>')
          p.write_text(text,encoding='utf-8')

          # Regression assertions for these labels.
          p=Path('tests/v5_1_3_website_browser.spec.mjs'); text=p.read_text(encoding='utf-8')
          marker="test('project selectors change query-string state'"
          insert="""test('selected-project labels do not retain GO Mall-only or misclassified QA wording', async ({page}) => {\n  await page.goto(`${base}/energy`, {waitUntil:'networkidle'});\n  await expect(page.locator('.energy-feature-card')).toContainText('Load Evidence');\n  await expect(page.locator('.energy-feature-card')).not.toContainText('QA Status');\n  await page.goto(`${base}/risk`, {waitUntil:'networkidle'});\n  await page.locator('#risk-project').selectOption({index:1});\n  await expect(page.locator('.risk-kpi-grid')).toContainText('Worst Selected-Project Min DSCR');\n  await expect(page.locator('.risk-kpi-grid')).toContainText('Selected-Project Zero-DSCR Scenarios');\n  await expect(page.locator('.risk-kpi-grid')).not.toContainText('Worst GO Mall Min DSCR');\n  await page.goto(`${base}/diligence`, {waitUntil:'networkidle'});\n  await expect(page.locator('.diligence-filters')).toContainText('Primary next action');\n  await expect(page.locator('.diligence-filters')).toContainText('All primary actions');\n});\n\n"""
          if marker not in text: raise SystemExit('browser test insertion marker missing')
          text=text.replace(marker,insert+marker,1)
          p.write_text(text,encoding='utf-8')

          Path('.github/workflows/final-semantic-cleanup.yml').unlink()
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit cleanup to staging branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clarify selected-project and evidence labels'
          git push --force origin HEAD:refs/heads/codex/final-semantic-cleanup
