name: final-content-audit-fixes

on:
  push:
    branches: [codex/final-content-audit-control]
    paths:
      - '.github/workflows/final-content-audit-fixes.yml'

permissions:
  contents: write
  actions: read

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply exact content-audit corrections
        run: |
          python scripts/final_content_audit_patch.py
          python scripts/final_content_audit_css_patch.py

      - name: Recalculate authoritative public data with corrected metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33629919973 --repo susayold/vietgreen-ci-solar-project-finance --name vietgreen-v5-1-3-full-data-model-release --dir /tmp/vietgreen-frozen
          python scripts/build_corrected_model.py /tmp/vietgreen-frozen

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate current public data and claims
        run: |
          npm run test:data
          npm run test:claims
          npm run lint

      - name: Build and browser-test all eight pages
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line

      - name: Commit audited website to result branch
        run: |
          rm .github/workflows/final-content-audit-fixes.yml scripts/final_content_audit_patch.py scripts/final_content_audit_css_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app public/data scripts tests .github/workflows/final-content-audit-fixes.yml
          git commit -m 'Align all website pages with corrected project model'
          git push --force origin HEAD:refs/heads/codex/final-content-audit-result
