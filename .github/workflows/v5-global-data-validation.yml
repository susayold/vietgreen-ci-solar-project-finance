name: V5.1 Global Real-Data Full-Engine Validation
on:
  push:
    branches: [v5-global-real-data, v5.1-full-engine-remediation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ephemeral CI dependencies
        run: python -m pip install --disable-pip-version-check pytest openpyxl
      - name: V5.1 one-command full-engine build and gates
        run: python -m analytics.build_v5_release
      - name: Expanded V5.1 substantive QA
        run: python -m pytest -q tests
      - name: Upload V5.1 remote release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vietgreen-v5-1-full-engine-release
          path: |
            release/V5_RUNTIME_RELEASE_MANIFEST.json
            release/V5_BUILD_STATUS.json
            release/V5_1_INPUT_FREEZE_MANIFEST.json
            outputs/**
            artifacts/v5_model/**
            artifacts/v5_website_data/**
            artifacts/v5_surfaces/**
            validation/**
            research/SOURCE_QUALITY_REPORT_V5_1.md
          if-no-files-found: error
