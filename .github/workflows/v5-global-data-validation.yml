name: V5.1.1 Global Data and Model Validation
on:
  push:
    branches:
      - v5.1.1-data-model-content-rebuild
  workflow_dispatch:
jobs:
  validate-v5-1-1:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: python -m pip install --upgrade pip pytest openpyxl
      - name: Seal CI timestamp
        run: echo "V5_1_1_FREEZE_DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build V5.1.1 model, workbook and registers
        run: python -m analytics.build_v5_1_1_release
      - name: Validate current surfaces
        run: python -m scripts.run_v5_1_1_checks
      - name: Run semantic and regression tests
        run: python -m pytest -q
      - name: Upload V5.1.1 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vietgreen-v5-1-1-full-data-model-release
          path: |
            artifacts/v5_1_1_model
            artifacts/v5_1_1_surfaces
            outputs
            validation
            release
          if-no-files-found: error
      - name: Seal artifact metadata into runtime manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          url=f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/runs/{os.environ['GH_RUN_ID']}/artifacts"
          req=urllib.request.Request(url,headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req) as resp: payload=json.load(resp)
          artifact=next(x for x in payload["artifacts"] if x["name"]=="vietgreen-v5-1-1-full-data-model-release")
          p=Path("release/V5_RUNTIME_RELEASE_MANIFEST.json"); data=json.loads(p.read_text())
          data["artifact_id"]=str(artifact["id"]); data["artifact_digest"]=artifact["digest"]; data["artifact_name"]=artifact["name"]
          p.write_text(json.dumps(data,indent=2,sort_keys=True)+"\n")
          m=Path("release/MODEL_RELEASE_MANIFEST.json"); md=json.loads(m.read_text()); md["runtime_manifest_artifact_id"]=str(artifact["id"]); md["runtime_manifest_artifact_digest"]=artifact["digest"]; m.write_text(json.dumps(md,indent=2,sort_keys=True)+"\n")
          PY
      - name: Upload sealed runtime manifests
        uses: actions/upload-artifact@v4
        with:
          name: vietgreen-v5-1-1-runtime-manifest
          path: |
            release/MODEL_RELEASE_MANIFEST.json
            release/V5_RUNTIME_RELEASE_MANIFEST.json
            release/V5_1_1_INPUT_FREEZE_MANIFEST.json
          if-no-files-found: error
