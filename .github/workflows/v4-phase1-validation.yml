name: v4-phase1-validation

on:
  push:
    branches: [main]
    paths:
      - "analytics/v4_returns.py"
      - "analytics/v4_phase1_engine.py"
      - "data/synthetic/load_archetypes.csv"
      - "data/synthetic/energy_uncertainty_budget.csv"
      - ".github/workflows/v4-phase1-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v4_phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V4 Phase 1 engine on the remote runner
        run: python -m analytics.v4_phase1_engine
      - name: Check aggregate outputs for accidental raw hourly export
        run: |
          test -f outputs/energy_p50_p90_p99.csv
          test -f outputs/load_matching_v4.csv
          test -f outputs/ppa_solver_frontier_v4.csv
          test -f outputs/project_returns_v4.csv
          test -f outputs/portfolio_current_negotiated_v4.csv
          test -f validation/V4_PHASE1_DOD.csv
          test -f validation/V4_PHASE1_RED_TEAM_REPORT.md
          if find outputs -maxdepth 1 -type f -name '*hourly*' | grep -q .; then
            echo "raw hourly export detected"
            exit 1
          fi
      - name: Commit V4 Phase 1 aggregate evidence
        run: |
          git config user.name "vietgreen-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/synthetic/load_archetypes.csv data/synthetic/energy_uncertainty_budget.csv outputs/energy_p50_p90_p99.csv outputs/load_matching_v4.csv outputs/ppa_solver_frontier_v4.csv outputs/project_returns_v4.csv outputs/portfolio_current_negotiated_v4.csv outputs/scenario_summary_v4.csv validation/V4_PHASE1_DOD.csv validation/V4_PHASE1_RED_TEAM_REPORT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: run V4 phase 1 remediation evidence [skip ci]"
          git push origin HEAD:main
      - name: Upload aggregate V4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: vietgreen-v4-phase1-evidence
          path: |
            outputs/energy_p50_p90_p99.csv
            outputs/load_matching_v4.csv
            outputs/ppa_solver_frontier_v4.csv
            outputs/project_returns_v4.csv
            outputs/portfolio_current_negotiated_v4.csv
            outputs/scenario_summary_v4.csv
            validation/V4_PHASE1_DOD.csv
            validation/V4_PHASE1_RED_TEAM_REPORT.md
