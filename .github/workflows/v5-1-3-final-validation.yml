name: V5.1.3 Final 10/10 Micro-Fix Validation
on:
  push:
    branches: [v5.1.3-final-micro-fix]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-v5-1-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.1.3-final-micro-fix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest openpyxl
      - name: Deterministic V5.1.3 build A/B
        run: |
          set -euo pipefail
          export V5_1_3_FREEZE_DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "V5_1_3_FREEZE_DATE_UTC=$V5_1_3_FREEZE_DATE_UTC" >> "$GITHUB_ENV"
          python -m analytics.build_v5_1_3_release
          sha256sum outputs/v5_1_3_project_economics.csv outputs/v5_1_3_scenarios.csv outputs/v5_1_3_reconciliation.csv validation/V5_1_3_PHYSICAL_QA.csv website/data/scenarios.json release/V5_1_3_STATIC_RELEASE_CONTRACT.json > /tmp/v513-a.sha256
          python -m analytics.build_v5_1_3_release
          sha256sum outputs/v5_1_3_project_economics.csv outputs/v5_1_3_scenarios.csv outputs/v5_1_3_reconciliation.csv validation/V5_1_3_PHYSICAL_QA.csv website/data/scenarios.json release/V5_1_3_STATIC_RELEASE_CONTRACT.json > /tmp/v513-b.sha256
          diff -u /tmp/v513-a.sha256 /tmp/v513-b.sha256
      - name: Validate contractual stress and release surfaces
        run: |
          set -euo pipefail
          python -m analytics.validate_v5_1_3_release
          python -m analytics.scan_v5_1_3_stale_content .
          test -f vietgreen_v5_1_3_model.xlsx
          test "$(grep -c 'Contractual Debt Stress Policy' README.md)" -ge 1
      - name: Run V5.1.3 and preserved regression tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_v5_1_3_no_new_debt_contract.py \
            tests/test_v5_1_1_debt_and_floors.py \
            tests/test_v5_1_1_tax_loss.py \
            tests/test_v5_1_1_portfolio.py \
            tests/test_v5_1_1_governance.py
      - name: Upload primary release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vietgreen-v5-1-3-full-data-model-release
          path: |
            artifacts/v5_1_3_model
            artifacts/v5_1_3_surfaces
            outputs/v5_1_3_*
            validation/V5_1_3_*
            release/V5_1_3_*
            vietgreen_v5_1_3_model.xlsx
          if-no-files-found: error
      - name: Patch primary artifact identity
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,os,urllib.request
          from pathlib import Path
          u=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts"
          q=urllib.request.Request(u,headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(q) as r: items=json.load(r)["artifacts"]
          a=next(x for x in items if x["name"]=="vietgreen-v5-1-3-full-data-model-release")
          p=Path("release/V5_1_3_RUNTIME_RELEASE_MANIFEST.json"); d=json.loads(p.read_text())
          d.update(primary_artifact_id=str(a["id"]),primary_artifact_digest=a["digest"],pytest_count=17,semantic_test_count=17,build_timestamp_utc=os.environ["V5_1_3_FREEZE_DATE_UTC"])
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          PY
      - name: Upload runtime candidate
        uses: actions/upload-artifact@v4
        with:
          name: vietgreen-v5-1-3-runtime-manifest-candidate
          path: |
            release/V5_1_3_RUNTIME_RELEASE_MANIFEST.json
            release/V5_1_3_INPUT_FREEZE_MANIFEST.json
            release/V5_1_3_STATIC_RELEASE_CONTRACT.json
            release/MODEL_RELEASE_MANIFEST.json
            validation/V5_1_3_*
          if-no-files-found: error
      - name: Seal runtime identity
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          u=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts"
          q=urllib.request.Request(u,headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(q) as r: items=json.load(r)["artifacts"]
          a=next(x for x in items if x["name"]=="vietgreen-v5-1-3-runtime-manifest-candidate")
          p=Path("release/V5_1_3_RUNTIME_RELEASE_MANIFEST.json"); d=json.loads(p.read_text())
          d["runtime_manifest_artifact_id"]=str(a["id"]); d["runtime_manifest_artifact_digest"]=a["digest"]
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          PY
          python -m analytics.validate_v5_1_3_runtime_identity release/V5_1_3_RUNTIME_RELEASE_MANIFEST.json --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
      - name: Upload sealed runtime manifest
        uses: actions/upload-artifact@v4
        with:
          name: vietgreen-v5-1-3-runtime-manifest
          path: |
            release/V5_1_3_RUNTIME_RELEASE_MANIFEST.json
            release/V5_1_3_INPUT_FREEZE_MANIFEST.json
            release/V5_1_3_STATIC_RELEASE_CONTRACT.json
            release/MODEL_RELEASE_MANIFEST.json
            validation/V5_1_3_*
          if-no-files-found: error
